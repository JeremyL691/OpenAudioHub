[workspace]
members = ["crates/oah", "desktop-tauri"]
resolver = "3"

[workspace.package]
version = "1.1.1"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
# Dependencies such as scrypt and argon2 are too slow unoptimized for tests.
opt-level = 3
