[workspace]
members = ["crates/oah", "desktop-tauri"]
resolver = "3"

[workspace.package]
version = "1.3.2"
edition = "2024"
# The AWS SDK here needs 1.94.1, so that is the floor for the whole workspace.
rust-version = "1.94.1"
license = "AGPL-3.0-only"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
# Dependencies such as scrypt and argon2 are too slow unoptimized for tests.
opt-level = 3
