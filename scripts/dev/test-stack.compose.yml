# Local integration test database. Started by scripts/dev/test-stack.sh.
# Project name oah-test. No named volumes: `down -v` discards all test data.
# The credentials below are local test values for 127.0.0.1 only.
name: oah-test

services:
  postgres:
    image: postgres:16
    restart: "no"
    environment:
      POSTGRES_USER: oah_test
      POSTGRES_PASSWORD: oah_test
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oah_test -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
