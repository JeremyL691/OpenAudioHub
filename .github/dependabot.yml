version: 2

updates:
  # The actions the workflows use.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Rust dependencies, grouped so a version bump arrives as one pull request.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      extension:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /contract-tests
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      contract-tests:
        patterns: ["*"]
