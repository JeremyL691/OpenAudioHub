name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  mac-app:
    name: Mac app (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm version comes from the packageManager field of web/package.json.
      - run: corepack enable

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install pkg-config
        run: command -v pkg-config >/dev/null 2>&1 || brew install pkg-config

      - name: Install web dependencies and build the web app
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web build

      # The key covers the build script, which pins every source archive and is part of the cache key.
      - uses: actions/cache@v4
        with:
          path: desktop-tauri/.cache/ffmpeg-*
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop-tauri/scripts/build-ffmpeg.sh') }}

      - name: Build ffmpeg and ffprobe sidecars
        working-directory: desktop-tauri
        run: scripts/build-ffmpeg.sh

      - name: Build the Mac app
        working-directory: desktop-tauri
        run: npx @tauri-apps/cli@2 build --bundles app,dmg

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: openaudiohub-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload the ffmpeg source archives
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-source
          path: desktop-tauri/binaries/source/*
          if-no-files-found: error

  image:
    name: Server image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jeremyl691/openaudiohub
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Draft GitHub Release
    needs: [mac-app, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: openaudiohub-dmg
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-source
          path: dist/source

      - name: Take the release notes from CHANGELOG.md
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { lines[++n] = $0 }
            END {
              while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--
              s = 1
              while (s <= n && lines[s] ~ /^[[:space:]]*$/) s++
              for (i = s; i <= n; i++) print lines[i]
            }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Create the draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: OpenAudioHub ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/source/*
            deploy/install.sh
            deploy/compose.yml
