name: Security

on:
  # Called by ci.yml, so a pull request runs these checks with the rest of the suite instead of
  # on a separate path filter. A change that touches nothing here still has to pass them.
  workflow_call:
  push:
    branches: [main]
  # New advisories appear without a commit here, so the checks also run on a schedule.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust advisories and licences
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # `check` with no subcommand covers advisories, bans, licences and sources with the
          # policy in deny.toml. The default arguments are left alone: they match how the
          # policy was tuned against this workspace.
          command: check
          # The action runs in a musl image, so the host triplet in rust-toolchain.toml does not
          # exist there and cargo would try to download it. cargo-deny only reads the lock file,
          # so it does not need the workspace compiler.
          rust-version: "1.94.1"

  npm:
    name: JavaScript advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      # Every lock file in the tree, with its development dependencies. The build tools run on a
      # developer machine and in this workflow, so an advisory in them is in scope: the extension
      # keeps all of its tooling in devDependencies, and an audit of production packages alone
      # would never look at it.
      #
      # A high or worse advisory fails the run. Moderate notices are printed and do not fail it:
      # the ones left are in transitive packages the shipped build never reaches.
      - name: Audit the web app
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm audit --audit-level high
      - name: Audit the extension
        working-directory: extension
        run: pnpm install --frozen-lockfile && pnpm audit --audit-level high
      - name: Audit the contract tests
        working-directory: contract-tests
        run: pnpm install --frozen-lockfile && pnpm audit --audit-level high
