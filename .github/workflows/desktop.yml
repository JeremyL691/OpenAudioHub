name: Desktop

# The desktop app's own checks and build. Runs for changes to the desktop shell and the web code it shares
# with the desktop mode (src/lib/desktop, src/app/api/desktop, src/components/desktop-mode-provider.tsx).

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/lib/desktop/**'
      - 'src/app/api/desktop/**'
      - 'src/components/desktop-mode-provider.tsx'
      - '.github/workflows/desktop*.yml'
      - 'src/lib/auth.ts'
      - 'src/lib/env.ts'
      - 'src/db/queries/desktop-user.ts'
      - 'src/app/layout.tsx'
      - 'src/app/page.tsx'
      - 'src/app/(auth)/login/page.tsx'
      - 'src/components/dashboard/user-menu.tsx'
      - 'src/components/plaud-connect-tabs.tsx'
      - 'scripts/export-for-desktop.sh'
  push:
    branches:
      - feature/desktop-app
    paths:
      - 'desktop/**'
      - 'src/lib/desktop/**'
      - 'src/app/api/desktop/**'
      - 'src/components/desktop-mode-provider.tsx'
      - '.github/workflows/desktop*.yml'
      - 'src/lib/auth.ts'
      - 'src/lib/env.ts'
      - 'src/db/queries/desktop-user.ts'
      - 'src/app/layout.tsx'
      - 'src/app/page.tsx'
      - 'src/app/(auth)/login/page.tsx'
      - 'src/components/dashboard/user-menu.tsx'
      - 'src/components/plaud-connect-tabs.tsx'
      - 'scripts/export-for-desktop.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/desktop-build.yml
