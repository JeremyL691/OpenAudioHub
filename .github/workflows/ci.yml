name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-24.04
    # The bundled ONNX Runtime needs GCC 14's libstdc++.
    container: rust:1-trixie
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p oah --all-targets -- -D warnings
      - run: cargo test -p oah

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec tsc -b
        working-directory: web
      - run: pnpm build
        working-directory: web

  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: extension
      - run: pnpm typecheck
        working-directory: extension
      - run: pnpm test
        working-directory: extension
      - run: pnpm build
        working-directory: extension
      - run: pnpm zip
        working-directory: extension

  contract:
    runs-on: ubuntu-24.04
    container: rust:1-trixie
    # Chromium falls back to the default download name when the process locale is not
    # UTF-8, which hides filenames derived from non-ASCII titles.
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg curl ca-certificates openssl xvfb
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
          corepack enable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
        working-directory: contract-tests
      - run: contract-tests/run.sh server
      - name: Extension end-to-end tests
        run: |
          pnpm install --frozen-lockfile
          xvfb-run -a pnpm e2e
        working-directory: extension
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-results
          path: .dev-artifacts/
          include-hidden-files: true
