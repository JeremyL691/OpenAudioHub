# OpenAudioHub, self-hosted: one container, all data in one volume.
#   1. Put ENCRYPTION_KEY (64 hex characters: `openssl rand -hex 32`) and APP_URL in a .env file next to this file.
#   2. docker compose up -d
# Keep ENCRYPTION_KEY safe: without it, encrypted titles, transcripts and summaries cannot be read.
name: openaudiohub

services:
  app:
    image: ghcr.io/jeremyl691/openaudiohub:${OPENAUDIOHUB_VERSION:-latest}
    restart: unless-stopped
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # The port below is bound to localhost, so a reverse proxy on the host is what reaches
      # the app. Trusting its headers gives each visitor their own rate-limit bucket. Set this
      # to false when the app is reached without a proxy.
      RATE_LIMIT_TRUST_PROXY_HEADERS: ${RATE_LIMIT_TRUST_PROXY_HEADERS:-true}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      # false runs one local account that opens without sign-in. true turns on separate accounts.
      OAH_MULTI_USER: ${OAH_MULTI_USER:-false}
      # Empty keeps the default: private webhook targets are refused in the server.
      WEBHOOKS_REQUIRE_PUBLIC_TARGETS: ${WEBHOOKS_REQUIRE_PUBLIC_TARGETS:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - data:/data

volumes:
  data:
